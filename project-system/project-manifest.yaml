  status: observe-entered-bounded-docs-only-contract-and-governance-work
                                 # Rein deskriptiver aktueller Projektzustand,
                                 # KEINE Produktreife-, Release-, Support-,
                                 # Capability- oder Implementierungsreife-Taxonomie
                                 # und KEINE Autoritaet ueber die akzeptierte
