# CoreOps – Project System Manifest
# NDF-Basis: Nova-Development-Framework v1.0.0 (Tag v1.0.0, Commit 9dcadc1)
# Der veraenderliche Branch "main" ist NICHT normativ.
# Erzeugt durch Work Package CO-WP-001 (docs-only, Core Governance Skeleton).

project:
  name: CoreOps
  slug: coreops
  slogan: "One Dashboard. Controlled Operations."
  status: observe-entered-bounded-docs-only-contract-and-governance-work
                                 # Rein deskriptiver aktueller Projektzustand,
                                 # KEINE Produktreife-, Release-, Support-,
                                 # Capability- oder Implementierungsreife-Taxonomie
                                 # und KEINE Autoritaet ueber die akzeptierte
                                 # Release Taxonomy
                                 # (docs/governance/RELEASE_TAXONOMY.md).
                                 # Bedeutung woertlich: die Foundation-0.1-
                                 # Dokumentations-/Governance-Phase ist durch die
                                 # Human-Maintainer-Entscheidung HM-F1
                                 # (APPROVED / COMPLETE) foermlich GESCHLOSSEN; ihr
                                 # Stand ist als annotierter, unsignierter Tag
                                 # v0.0.1-foundation veroeffentlicht. Die Phase
                                 # Observe ist durch HM-O1 (APPROVED WITH BOUNDARY)
                                 # BETRETEN und mit Grenze autorisiert. HM-O2
                                 # (APPROVED) hat den ersten Wertslice gewaehlt:
                                 # Local Linux Host Identity & Basic System
                                 # Observation. HM-O3 (APPROVED) hat CO-WP-032
                                 # autorisiert; HM-O4 (APPROVED WITH EXACT
                                 # BOUNDARY) begrenzt dessen Ausfuehrung auf
                                 # docs-only. Aktuell laeuft ausschliesslich
                                 # dokumentations- und governanceorientierte
                                 # Vertrags- und Uebergangsarbeit.
                                 # Impliziert NICHT: Implementierung autorisiert
                                 # oder begonnen;
                                 # NICHT: produktiver Anwendungscode autorisiert
                                 # oder vorhanden;
                                 # NICHT: Sprache oder Runtime ausgewaehlt;
                                 # NICHT: Erhebungsmechanismus ausgewaehlt (P-3);
                                 # NICHT: Zielzugriff autorisiert (P-1);
                                 # NICHT: No-Mutation-Evidenz erbracht (P-2);
                                 # NICHT: reale Beobachtung durchgefuehrt;
                                 # NICHT: Tests implementiert oder ausgefuehrt;
                                 # NICHT: Capability implementiert oder supported;
                                 # NICHT: funktionaler Produktrelease;
                                 # NICHT: GitHub Release (HM-R11 NOT AUTHORIZED);
                                 # NICHT: ein Folge-Work-Package erzeugt oder
                                 # reserviert.
  project_type: Universal Operations Control Plane

roles:
  owner: Human Maintainer
  architecture_lead: Nova
  implementation_assistant: Claude

language:
  primary: Deutsch
  secondary: Englisch

delivery:
  self_hosted: target            # Zielbild, noch zu bestaetigen
  offline_capable: target        # Zielbild, noch zu bestaetigen
  docker_first: baseline         # Foundation 0.1 Delivery Baseline (HM-2, APPROVED
                                 # WITH BOUNDARY). Docker-first != Docker-only;
                                 # != zwingende interne Anwendungsarchitektur;
                                 # != zwingende Runtime-Abhaengigkeit;
                                 # != Observe-Voraussetzung. Noch nicht implementiert;
                                 # keine Container-Technologie ausgewaehlt.

governance:
  documentation: required
  security: required
  tests: required
  ci: recommended                # Status: pending

ndf:
  framework: Nova-Development-Framework
  version: "1.0.0"
  tag: "v1.0.0"
  commit: "9dcadc1"
  normative_source: tag-and-commit-only
  main_branch_normative: false
  ndf_level: 1                   # Initialer Bootstrap-Status. Keine NDF-Reife,
                                 # keine Zertifizierung, keine vollstaendige
                                 # Compliance behauptet. Siehe Note unten.

paths:
  project_brain: project-brain/PROJECT_BRAIN.md
  context_pack_foundation: project-brain/CONTEXT_PACK_FOUNDATION_0_1.md
  project_profile: project-system/PROJECT_PROFILE.md
  work_package_queue: project-system/WORK_PACKAGE_QUEUE.md
  next_phase: project-system/NEXT_PHASE.md
  roadmap: ROADMAP.md

repository:
  url: https://github.com/KayKaspers/CoreOps   # Verifiziert via origin (Clone-Remote: .git). CO-WP-003.

source:
  product_vision: "CoreOps Concept v3.0 - Platform Foundation"
  provided_by: Human Maintainer
  provided_on: "2026-07-12"
  status: "Als Produktvision und Ausgangsbasis akzeptiert. Technische Detail-
           entscheidungen gelten als unbestaetigte Foundation-Kandidaten."

notes:
  - id: ndf-level-semantics
    text: >
      ndf_level 1 bedeutet fuer CoreOps ausschliesslich "initialer NDF-
      Projektbootstrap". Es bedeutet NICHT vollstaendige NDF-Konformitaet,
      technische Reife, Releasebereitschaft, Sicherheitsfreigabe oder eine
      erreichte Produktstufe. Der Zahlenwert bleibt in CO-WP-003 unveraendert.
      Die abweichende Starter-Vorlage mit ndf_level 2 bleibt als dokumentierte
      NDF-Quellambiguitaet erhalten, ist aber kein CoreOps-Blocker (CCR-03).
  - id: repository-status
    text: >
      Repository-URL in CO-WP-003 verifiziert und gesetzt: kanonische Web-URL
      https://github.com/KayKaspers/CoreOps (Clone-Remote origin endet auf
      .git). Aufloesung des vorherigen Platzhalters "pending-human-maintainer".
