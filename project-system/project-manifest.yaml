                                 # Bedeutung woertlich: die Foundation-0.1-
                                 # Dokumentations-/Governance-Phase ist durch die
                                 # Human-Maintainer-Entscheidung HM-F1
                                 # (APPROVED / COMPLETE) foermlich GESCHLOSSEN; ihr
                                 # Stand ist als annotierter, unsignierter Tag
                                 # v0.0.1-foundation veroeffentlicht. Die Phase
                                 # Observe ist durch HM-O1 (APPROVED WITH BOUNDARY)
                                 # BETRETEN und mit Grenze autorisiert. HM-O2
                                 # (APPROVED) hat den ersten Wertslice gewaehlt:
                                 # Local Linux Host Identity & Basic System
                                 # Observation. HM-O3 (APPROVED) hat CO-WP-032
                                 # autorisiert; HM-O4 (APPROVED WITH EXACT
                                 # BOUNDARY) begrenzt dessen Ausfuehrung auf
                                 # docs-only. Aktuell laeuft ausschliesslich
                                 # dokumentations- und governanceorientierte
                                 # Vertrags- und Uebergangsarbeit.
                                 # Entschieden (Gate A, jeweils eigene,
                                 # ausdrueckliche Human-Maintainer-Entscheidung,
                                 # jeweils ohne ADR und ohne Decision-ID):
                                 # P-3 Erhebungsmechanismus AUSGEWAEHLT -
                                 # ausschliesslich als Mechanismusklasse
                                 # (Option A primaer, Option B ausschliesslich
                                 # ergaenzend, Option C nicht Standardweg,
                                 # Option D und E ausgeschlossen, kein
                                 # Netzwerktransport); A-6 erfuellt.
                                 # Sprache/Runtime AUSGEWAEHLT - Go,
                                 # ausschliesslich als Sprach-/Runtime-Klasse
                                 # fuer den ersten Observe-Slice; A-7 erfuellt.
                                 # Source Tree ENTSCHIEDEN - repository-
                                 # verwurzelte Go-Struktur: cmd/coreops/,
                                 # internal/observe/, internal/observe/collect/;
                                 # Normalisierung zunaechst ohne eigenes Paket
                                 # innerhalb internal/observe/; Tests kuenftig
                                 # colocated *_test.go; kein pkg/, kein src/,
                                 # kein Top-Level-tests/, keine oeffentliche
                                 # Go-API; A-8 erfuellt.
                                 # Dependency Admission IN KRAFT - Gate-A-Punkt
                                 # A-9 erfuellt; Disposition APPROVE OPTION B
                                 # WITH NOVA BOUNDARY CLARIFICATIONS.
                                 # Zugelassene Drittabhaengigkeiten: 0; konkret
                                 # zugelassen: keine; erster Observe-Slice
                                 # ZERO-THIRD-PARTY-DEFAULT - Drittabhaengigkeits-
                                 # nutzung untersagt, solange die konkrete
                                 # Abhaengigkeit nicht das vollstaendige
                                 # Admission-Verfahren durchlaufen und eine
                                 # ausdrueckliche Human-Maintainer-Zulassung
                                 # erhalten hat; Bequemlichkeit ist keine
                                 # hinreichende Begruendung. Standardbibliothek
                                 # der gewaehlten Go-Distribution und ohne
                                 # separaten Softwarebezug genutzte Plattform-
                                 # faehigkeit benoetigen keine individuelle
                                 # Drittzulassung - deren Lieferkette ist dadurch
                                 # NICHT geklaert; Go-Distribution, Standard-
                                 # bibliothek und Toolchain bleiben A-13 bzw.
                                 # nachgelagerter Governance zugeordnet. Jedes
                                 # separat bezogene Modul, Paket, jede Bibliothek
                                 # und jedes Werkzeug - einschliesslich
                                 # golang.org/x/... sofern nicht tatsaechlich
                                 # Standardbibliothek - ist Drittabhaengigkeit.
                                 # Transitive, Build-only-, Test-only-, separat
                                 # bezogene Tooling-/Codegenerierungs- und
                                 # vendorierte Abhaengigkeiten sind im Scope;
                                 # vendored ist nicht Erstpartei. Zulassung
                                 # ausschliesslich durch den Human Maintainer, je
                                 # konkreter Abhaengigkeit und nur innerhalb eines
                                 # ausdruecklich autorisierten Work-Package-
                                 # Scopes; gebunden an Version/Revision, Digest,
                                 # Herkunft, Lizenzstand und aufgeloeste
                                 # transitive Schliessung. Eine Update-Policy
                                 # autorisiert keinen kuenftigen Abhaengigkeits-
                                 # stand.
                                 # NEW-8 (README / LICENSE) ENTSCHIEDEN -
                                 # Gate-A-Punkt A-10 erfuellt; Disposition
                                 # APPROVE README + APACHE-2.0 PUBLICATION MODEL
                                 # WITH NOVA BOUNDARY CLARIFICATIONS.
                                 # README.md SHALL EXIST - inzwischen
                                 # ERSTELLT und VORHANDEN. Durch A-10 selbst
                                 # NICHT zur Erstellung autorisiert; die
                                 # Erstellungsautoritaet stammt aus einer
                                 # davon getrennten, ausdruecklich
                                 # autorisierten Human-Maintainer-
                                 # Publikations-Realisierung VOR dem ersten
                                 # produktiven Source-Commit. README-Autoritaet: oeffentliche
                                 # Zusammenfassung ohne normative Autoritaet;
                                 # die Source-of-Truth-Hierarchie bleibt
                                 # unveraendert; quantitative Angaben sind
                                 # Spiegel und keine Autoritaet - duplizierte
                                 # Zaehler minimieren, autoritative Verweise
                                 # bevorzugen, hart kodierte Zahlen nur
                                 # ausdruecklich aktuell, gepflegt und
                                 # nicht-autoritativ.
                                 # LICENSE SHALL EXIST - inzwischen ERSTELLT
                                 # und VORHANDEN (standardmaessiger,
                                 # unveraenderter Apache-2.0-Text). Durch A-10
                                 # selbst NICHT zur Erstellung autorisiert.
                                 # Veroeffentlichungsrechte-Modus:
                                 # PUBLIC / OPEN SOURCE.
                                 # Outbound-Lizenz: Apache-2.0, standardmaessiger
                                 # und unveraenderter Lizenztext; die gesondert
                                 # autorisierte Publikations-Realisierung hat das
                                 # LICENSE-Artefakt angelegt; der Lizenztext wird
                                 # hier NICHT wiedergegeben.
                                 # Beitragsprogramm NICHT AKTIV; CONTRIBUTING.md
                                 # nicht autorisiert; CLA keine; DCO keiner.
                                 # Urheberrechtliche Rechteeinraeumung ist keine
                                 # Namens- oder Markenrechtseinraeumung; keine
                                 # eingetragene Marke beansprucht; gesonderte
                                 # Markenrichtlinie zurueckgestellt.
                                 # Behauptungsgrenzen bleiben in Kraft: keine
                                 # Produktionsreife, Zertifizierung, Support-
                                 # zusage, SLA, Verfuegbarkeits-, Wartungs- oder
                                 # Kompatibilitaetsgarantie.
                                 # Erstellungsautoritaet: eine Datei entsteht
                                 # erst mit (1) einer ausdruecklich autorisierten
                                 # Repository-/Work-Package-Grenze, die die Datei
                                 # und ihre oeffentliche Inhaltsautoritaet
                                 # benennt, (2) der Autorisierung des konkreten
                                 # Inhalts bzw. des standardmaessigen Lizenz-
                                 # textes und (3) den Human-Maintainer-
                                 # Repository-, Staging-, Commit- und Push-Gates.
                                 # Gate A: 11 von 14 erfuellt, 0 teilweise,
                                 # 3 offen - NICHT PASSIERT (offen: A-11,
                                 # A-13, A-14). Gate B: 0 von 8 -
                                 # NICHT PASSIERT.
                                 # Impliziert NICHT: Implementierung autorisiert
                                 # oder begonnen;
                                 # NICHT: produktiver Anwendungscode autorisiert
                                 # oder vorhanden;
                                 # NICHT: Source Tree angelegt - kein cmd/,
                                 # kein internal/, kein testdata/, keine
                                 # Quelldatei, keine Testdatei, keine Fixture;
                                 # die Anlage neuer Top-Level-Struktur bleibt
                                 # nach Repository Governance Standard
                                 # Abschnitt 12 eigenstaendig gate-pflichtig;
                                 # NICHT: go.mod oder go.sum angelegt oder
                                 # autorisiert; Modulpfad, Go-Version,
                                 # Distribution und Toolchain-Version nicht
                                 # entschieden;
                                 # NICHT: Abhaengigkeit zugelassen (0 zugelassen,
                                 # keine konkret zugelassen; das Admission-Gate
                                 # ist in Kraft und A-9 erfuellt - Policy in Kraft
                                 # bedeutet NICHT Abhaengigkeit zugelassen;
                                 # Vorschlag bedeutet NICHT Zulassung; WP
                                 # autorisiert bedeutet NICHT Abhaengigkeit
                                 # zugelassen);
                                 # NICHT: Paket, Modul, Bibliothek, Werkzeug,
                                 # Testframework, Build-Werkzeug oder
                                 # Codegenerator ausgewaehlt;
                                 # NICHT: Abhaengigkeit installiert, aufgeloest
